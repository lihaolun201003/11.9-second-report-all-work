<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="610" viewBox="0 0 1300 610"><rect width="1300" height="610" fill="#f5f5ef"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#173e42}.t{font-size:26px;font-weight:600}.s{font-size:19px}.n{font-size:16px;fill:#617675}</style><text x="55" y="62" class="t">固定三维玻璃器件在系统中的位置</text><text x="55" y="98" class="n">功能边界示意：候选研究位置，不代表 Google 或任何厂商已采用本课题器件</text><g stroke="#2a6a6d" stroke-width="2" fill="#ffffff"><rect x="55" y="165" width="240" height="155" rx="12"/><rect x="365" y="165" width="250" height="155" rx="12" fill="#dceee8"/><rect x="685" y="165" width="250" height="155" rx="12"/><rect x="1005" y="165" width="240" height="155" rx="12"/></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#286f70"/></marker></defs><g stroke="#286f70" stroke-width="3" marker-end="url(#a)"><path d="M295 242H355"/><path d="M615 242H675"/><path d="M935 242H995"/></g><text x="80" y="216" class="s">收发器 / 光 I/O</text><text x="80" y="252" class="n">主动电光转换、WDM</text><text x="80" y="285" class="n">协议、编码与光源</text><text x="390" y="216" class="s">固定玻璃 Shuffle</text><text x="390" y="252" class="n">制造前决定端口映射</text><text x="390" y="285" class="n">三维波导、端面适配</text><text x="710" y="216" class="s">OCS 或网络模块</text><text x="710" y="252" class="n">OCS 才改变运行期连接</text><text x="710" y="285" class="n">也可接固定背板接口</text><text x="1030" y="216" class="s">对端系统</text><text x="1030" y="252" class="n">交换机 / 计算节点</text><text x="1030" y="285" class="n">实际功能取决于架构</text><rect x="55" y="385" width="1190" height="150" rx="12" fill="#fff" stroke="#d6dcd3"/><text x="80" y="425" class="s">本课题的软件链</text><text x="80" y="466" class="s">连接表 → 端口与工艺规则 → 三维曲线 → 独立几何验证 → 模型与加工评价</text><text x="80" y="505" class="n">1024 = 1024 条固定物理路径；单双向、波长与供光另行计数。几何合格 ≠ 器件实测合格。</text><text x="55" y="580" class="n">本报告自绘。依据 Corning Shuffle / Jupiter / Apollo 的功能分工；玻璃方框为研究候选。</text></svg>